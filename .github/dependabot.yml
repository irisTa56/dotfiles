version: 2
updates:
  # GitHub Actions used by the CI workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # One pull request for all of a week's version updates. Auto-merge runs on
    # GITHUB_TOKEN, which has no `workflows` permission: once one update to a
    # workflow file has merged, GitHub refuses to merge a second pull request
    # that was branched before it and touches the same file, and disables its
    # auto-merge.
    groups:
      actions:
        patterns:
          - "*"

  # Hex packages of the Mix project. Dependabot's own three-day cooldown already
  # outlasts the one-day Hex window this machine sets, so none is configured here.
  - package-ecosystem: "mix"
    directory: "/elixir"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build(elixir)"
    # Version updates move only what the manifest names unless told otherwise;
    # the CI baseline sets this on every lockfile entry.
    allow:
      - dependency-type: "all"
    # One pull request for all of a week's version updates, which auto-merge as
    # the actions ones do once `elixir-qa` passes.
    groups:
      hex:
        patterns:
          - "*"
