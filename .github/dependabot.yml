version: 2
updates:
  # GitHub Actions used by the CI workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    # One pull request for all of a week's version updates. Auto-merge runs on
    # GITHUB_TOKEN, which has no `workflows` permission: once one update to a
    # workflow file has merged, GitHub refuses to merge a second pull request
    # that was branched before it and touches the same file, and disables its
    # auto-merge.
    groups:
      actions:
        patterns:
          - "*"

  # Crates of the Rust workspace: the dotfiles-tasks binary's, and those of dotfiles-local,
  # which Dependabot reaches through the workspace's members. The `fix` prefix makes
  # release-please cut a release for an update, so the binaries the shared tasks download
  # carry it; one that moves only dotfiles-local's crates cuts one too, since it changes
  # rust/Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "fix(deps)"
    allow:
      - dependency-type: "all"
    groups:
      cargo:
        patterns:
          - "*"
