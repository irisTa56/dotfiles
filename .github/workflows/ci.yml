name: CI

# Follows the CI baseline in .claude/rules/ci-baseline.md; a departure from it says why here.
# Each `qa:` task runs by name in one job; which tasks need a job, and why, is in
# the comment above `[tasks.pre-commit]` in mise.toml. A new job also needs a place in
# the main ruleset's required checks before a merge waits on it.

on:
  # No path filter: these checks are required status checks on main, so they must
  # report on every PR (a check that never runs would block merges forever).
  pull_request:
  push:
    branches: [main]
  # Weekly, as k-boat does: both secret scans cover the whole history on a scheduled
  # run, which catches what a PR scan missed, and every job meets this week's release
  # of the tools mise.toml tracks at `latest` even when no PR comes in. GitHub
  # notifies whoever last edited the cron line when a scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"

# Dependabot PRs run with a read-only token; these jobs need nothing more.
permissions:
  contents: read

env:
  # The repository's .config/mise/config.toml is the machine-wide config that
  # ~/.config/mise links to, and mise also reads it as this project's own; this keeps
  # its settings, env and tool list, all set for that machine, out of every job.
  MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml
  # `mise run` would otherwise install every tool mise.toml lists before running a
  # task, apm-cli included; each job installs only what its task needs instead.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # The postinstall hook in mise.toml sets up this checkout's git hooks, which no job
  # runs, and every `mise install` would run it.
  MISE_NO_HOOKS: "1"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: rumdl
          # mise.toml tracks these tools at `latest`, and a restored cache would hold
          # each at the release it was first saved with until mise.toml changed.
          cache: false
      - run: mise run qa:md
      # The skills are markdown too, and this check needs only git and POSIX utilities.
      - run: mise run qa:skills

  shell-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: shellcheck shfmt
          cache: false # as in `markdown-lint`
      - run: mise run qa:sh

  ts-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: biome
          cache: false # as in `markdown-lint`
      - run: mise run qa:ts

  elixir-qa:
    runs-on: ubuntu-latest
    env:
      # Erlang, Elixir and jq are named in the global config alone, so this job reads
      # it where the others leave it out.
      MISE_IGNORED_CONFIG_PATHS: ""
      # In place of the baseline's `install_args`, which limits the action's
      # `mise install` alone: the global config tracks some thirty tools at `latest`,
      # and every other mise command, the action's own `mise ls` and `mise env`
      # among them, would resolve each one's version, which cost this job seconds
      # per call. The integration tests of skills_update read its lockfile with the
      # real yq, and their fake gh applies the --jq filter with the real jq; those
      # of mise_multi_upgrade drive the mise this action installs, after clearing
      # every MISE_ variable, this one included.
      MISE_ENABLE_TOOLS: erlang,elixir,yq,jq
      # mise picks builds.hex.pm's precompiled Erlang on its own only on the Ubuntu
      # releases it lists, and elsewhere builds OTP from source with kerl, which
      # takes minutes. Naming the runner's release makes it take that release's
      # build; move the value when ubuntu-latest moves.
      MISE_ERLANG_PRECOMPILED_OS: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        id: mise
        with:
          # With MISE_ERLANG_PRECOMPILED_OS above, mise installs a precompiled
          # Erlang rather than building it.
          cache: false # as in `markdown-lint`
      # A fresh Elixir install has no Hex, and `mix deps.get` would stop to ask for it.
      # mix.lock pins every version, so the runner needs none of the release window
      # this machine sets in Hex's global config. The version goes into the cache key
      # below; `test` fails the job rather than leave it out of the key.
      - id: hex
        run: |
          mix local.hex --force
          version=$(mix hex.info | awk '$1 == "Hex:" { print $2 }')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The dependencies and their builds, most of what qa:ex compiles. The key holds
      # the Erlang and Elixir the action resolved, so a new release of either starts
      # a fresh cache, unlike the tool cache `markdown-lint` turns off. This project's
      # own build stays out, so --warnings-as-errors compiles all of it every run; the
      # builds are matched one directory each, since actions/cache hands a matched
      # directory to tar whole, and an exclusion cannot reach inside it.
      # Hex's registry cache comes along, as written by the run that fetched every
      # package, since qa:ex fetches offline from it: on one run that restored the
      # rest, the fetch below left credo's entry out of it. The key holds the Hex
      # version too, since a Hex release can change that cache's format, and Hex then
      # discards a restored one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            elixir/deps
            elixir/_build/test/lib/*
            !elixir/_build/test/lib/dotfiles
            ~/.hex/cache.bin
          key: elixir-deps-${{ runner.os }}-erlang-${{ steps.mise.outputs.erlang }}-elixir-${{ steps.mise.outputs.elixir }}-hex-${{ steps.hex.outputs.version }}-${{ hashFiles('elixir/mix.lock') }}
      # qa:ex fetches offline, from Hex's cache, which this fetch fills where the cache
      # above restored nothing.
      - run: mix deps.get
        working-directory: elixir
        env:
          MIX_ENV: test
      - run: mise run qa:ex
      # A check of the shell tasks under tasks/, which the Mix project provides.
      - run: mise run qa:tasks

  link-check-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: lychee
          cache: false # as in `markdown-lint`
      - run: mise run qa:links:offline

  # The two scans mirror the local pair, gitleaks per commit and trufflehog per push,
  # for commits that reached the repository without going through those hooks.
  # Known upstream limits, left as they are: a PR scan covers only the first 30 of its
  # commits and skips what a merge commit brings in (gitleaks-action#187, #236).
  secret-scan-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action pins an older gitleaks otherwise; mise.toml tracks `latest`.
          GITLEAKS_VERSION: latest
          # Commenting on the PR needs a write token this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: "false"

  secret-scan-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action walks history from the base to the head
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # Unlike secrets:push-scan, candidates are verified with their providers, as
          # the commits are already public by now; a live or unknown one fails the
          # job, and so does a commit the scan cannot read. SQLServer is excluded
          # because the message of commit b39f7e6 quotes a `Server=…;Password=…;`
          # example, which verifies as unknown and would fail every scheduled
          # full-history run; TruffleHog cannot ignore a finding in a commit message.
          extra_args: --results=verified,unknown --fail-on-scan-errors --exclude-detectors=SQLServer
