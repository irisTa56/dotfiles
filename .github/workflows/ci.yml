name: CI

# Follows the CI baseline in .claude/rules/ci-baseline.md; a departure from it says why here.
# Each step of hk.pkl's `check` hook runs by name in one job, through
# `hk check --all --step <name>`, so a step added there needs a job here, or a comment
# there saying why CI leaves it out. A new job also needs a place in the main ruleset's
# required checks before a merge waits on it.

on:
  # No path filter: these checks are required status checks on main, so they must
  # report on every PR (a check that never runs would block merges forever).
  pull_request:
  push:
    branches: [main]
  # Weekly, as k-boat does: both secret scans cover the whole history on a scheduled
  # run, which catches what a PR scan missed, and every job meets this week's release
  # of the tools mise.toml tracks at `latest` even when no PR comes in. GitHub
  # notifies whoever last edited the cron line when a scheduled run fails.
  schedule:
    - cron: "0 6 * * 1"

# Dependabot PRs run with a read-only token; these jobs need nothing more.
permissions:
  contents: read

env:
  # The repository's .config/mise/config.toml is the machine-wide config that
  # ~/.config/mise links to, and mise also reads it as this project's own; this keeps
  # its settings, env and tool list, all set for that machine, out of every job.
  MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml
  # `mise run` would otherwise install every tool mise.toml lists before running a
  # task, apm-cli included; each job installs only what its task needs instead.
  MISE_TASK_RUN_AUTO_INSTALL: "false"
  # The postinstall hook in mise.toml sets up this checkout's git hooks, which no job
  # runs, and every `mise install` would run it.
  MISE_NO_HOOKS: "1"

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: hk rumdl
          # mise.toml tracks these tools at `latest`, and a restored cache would hold
          # each at the release it was first saved with until mise.toml changed.
          cache: false
      - run: hk check --all --step rumdl

  shell-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: hk shellcheck shfmt
          cache: false # as in `markdown-lint`
      - run: hk check --all --step shellcheck --step shfmt

  ts-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: hk biome
          cache: false # as in `markdown-lint`
      - run: hk check --all --step biome

  rust-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # The real tools the tests run, offline: lychee for links-commit-check's,
          # gitleaks for secrets:commit-scan's, which run the task's script,
          # trufflehog for secrets-push-scan's. mise-multi-upgrade's drive the mise
          # this action puts on PATH, after clearing every MISE_ variable.
          # rust is installed in the steps below, from a cache of its own.
          install_args: hk lychee gitleaks trufflehog
          cache: false # as in `markdown-lint`
      # A departure from the CI baseline's `cache: false`: the Rust toolchain is cached,
      # keyed on the release `latest` resolves to in this run, so a new release misses
      # the cache and is downloaded rather than an older one being kept. rustup checks
      # a restored toolchain against the release's manifest and fetches whatever it
      # lacks, so the cache only saves time. The key also holds mise.toml's options for
      # rust, so a component added there is saved with the toolchain once, not fetched
      # on every run until the next release.
      # Fails on what it cannot resolve, rather than keying the cache on nothing.
      - id: rust
        run: |
          set -o pipefail
          version=$(mise latest rust)
          echo "version=${version:?}" >> "$GITHUB_OUTPUT"
          options=$(mise tool rust --tool-options | sha256sum | cut -c1-16)
          echo "options=$options" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/${{ steps.rust.outputs.version }}-*
            ~/.rustup/update-hashes/${{ steps.rust.outputs.version }}-*
          key: rust-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ steps.rust.outputs.options }}
      # mise-action exported the environment before rust was installed, without the
      # RUSTUP_TOOLCHAIN that selects mise.toml's release, so rustc in a later step
      # would run the runner image's default toolchain; this exports it again. The
      # dotenv output leaves PATH out, which already holds rust's bin directory.
      - run: |
          mise install rust
          mise env --dotenv >> "$GITHUB_ENV"
      # Caches the built dependencies; mise's other tools stay uncached, as
      # `cache: false` above leaves them. Measured in #508 (2026-11-21, 10 paired runs
      # of one commit), a matching cache cut the job from 47-68 s to 42-49 s (mean
      # difference 14 s, 95% interval 8-20 s), and the run that saved it spent about 6 s
      # doing so.
      # After a Cargo.lock change, rust-cache restores the previous lockfile's cache
      # and rebuilds what changed, a case #508 did not time.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - run: hk check --all --step rust --step skills-size

  config-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          # What the tasks under qa:config: read the config files with.
          install_args: hk yq
          cache: false # as in `markdown-lint`
      - run: hk check --all --step config --step mise-toml-width

  link-check-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: hk lychee
          cache: false # as in `markdown-lint`
      - run: hk check --all --step links-offline

  # The two scans mirror the local pair, gitleaks per commit and trufflehog per push,
  # for commits that reached the repository without going through those hooks.
  # Known upstream limits, left as they are: a PR scan covers only the first 30 of its
  # commits and skips what a merge commit brings in (gitleaks-action#187, #236).
  secret-scan-gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so gitleaks can scan the PR's commits
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action pins an older gitleaks otherwise; mise.toml tracks `latest`.
          GITLEAKS_VERSION: latest
          # Commenting on the PR needs a write token this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: "false"

  secret-scan-trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the action walks history from the base to the head
      - uses: trufflesecurity/trufflehog@3bd2b5887eb0efb8fa18bfd1d296032924e4ffdc # v3.99.9
        with:
          # Unlike secrets:push-scan, candidates are verified with their providers, as
          # the commits are already public by now; a live or unknown one fails the
          # job, and so does a commit the scan cannot read. SQLServer is excluded
          # because the message of commit b39f7e6 quotes a `Server=…;Password=…;`
          # example, which verifies as unknown and would fail every scheduled
          # full-history run; TruffleHog cannot ignore a finding in a commit message.
          extra_args: --results=verified,unknown --fail-on-scan-errors --exclude-detectors=SQLServer
