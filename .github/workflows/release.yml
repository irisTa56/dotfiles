name: Release

# Releases the dotfiles-tasks binary under rust/, which the shared tasks under tasks/
# run at the version their #MISE headers pin. release-please keeps a release pull
# request open for what has merged since the last release; merging it tags the
# release, and the build below attaches the binaries.
#
# Everything runs on the job's GITHUB_TOKEN, so no credential is added. A pull request
# that token opens starts no workflow on its own, so the CI that gates it is started
# here by workflow_dispatch; opening it at all needs the repository setting "Allow
# GitHub Actions to create and approve pull requests". A person merges it.
#
# Follows the CI baseline in .claude/rules/ci-baseline.md; it departs from it in using
# `if:`, since what runs after release-please depends on what it did.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # gh workflow run, for the CI of the release pull request.
      actions: write
    outputs:
      created: ${{ steps.release.outputs['rust--release_created'] }}
      tag: ${{ steps.release.outputs['rust--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
      # The pull request's branch is pushed by this token, which starts no workflow.
      - if: steps.release.outputs.prs_created == 'true'
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

  build:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          # musl links the binary statically, so it runs whatever glibc a host has.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      # The build provenance attestation that mise checks on install.
      id-token: write
      attestations: write
    env:
      # The workflow-level settings ci.yml explains, for the same reasons.
      MISE_IGNORED_CONFIG_PATHS: ${{ github.workspace }}/.config/mise/config.toml
      MISE_TASK_RUN_AUTO_INSTALL: "false"
      MISE_NO_HOOKS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust
          cache: false # as in ci.yml's `markdown-lint`
      - run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - run: cargo build --locked --release --target "$TARGET"
        working-directory: rust
        env:
          TARGET: ${{ matrix.target }}
      - id: archive
        run: |
          name="dotfiles-tasks-$TARGET.tar.gz"
          tar -czf "$name" -C "rust/target/$TARGET/release" dotfiles-tasks
          echo "name=$name" >> "$GITHUB_OUTPUT"
        env:
          TARGET: ${{ matrix.target }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.archive.outputs.name }}
      - run: gh release upload "$TAG" "$NAME"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag }}
          NAME: ${{ steps.archive.outputs.name }}
