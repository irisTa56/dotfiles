[tools]
gitleaks = "latest"
lychee = "latest"
rumdl = "latest"
shellcheck = "latest"
shfmt = "latest"
"pipx:apm-cli" = "latest"

[env]
HOMEBREW_BUNDLE_DUMP_NO_NPM = "1"
HOMEBREW_BUNDLE_DUMP_NO_VSCODE = "1"

[vars]
# Where the shell files are, for the two tasks below that lint or format them. Named once
# because the lists had already drifted apart when each carried its own: format-sh was
# missing the .zshrc fragment, which pre-commit had always checked.
sh_paths = "scripts tasks zsh_fragments .config/mise/tasks .claude/skills/sync-base/scripts .claude/skills/global-hooks/hooks"

# The pre-commit hook is written once and then left alone: `mise generate` moves an
# existing one aside as `<name>.old`, so rewriting on every install would displace
# whatever else had put a hook there and leave a copy of it behind each time.
# The push scan is registered in git's config instead, which runs beside any
# pre-push hook file and is safe to set on every install (see tasks/README.md).
# git before 2.54 ignores those keys, so the last line says so rather than
# leaving pushes unscanned in silence.
[hooks]
postinstall = '''
hook="$(git rev-parse --git-path hooks/pre-commit)"
test -f "$hook" || mise generate git-pre-commit --task pre-commit --write
git config hook.secrets-push-scan.event pre-push
git config hook.secrets-push-scan.command 'mise run secrets:push-scan'
git hook list pre-push 2>/dev/null | grep -qx secrets-push-scan || echo "warning: this git ignores hook.* config, so pushes are not scanned; git 2.54 or later runs it" >&2
'''

# tasks/ holds the task definitions this repository shares with others (see README).
# Naming it here replaces the default file-task directories, which this repository
# does not use, and loads the shared tasks the way a consuming repository loads them.
[task_config]
includes = ["tasks"]

# `mise bootstrap` sets a machine up from this checkout: these links and lines,
# then the tools, then the bootstrap task below. Each source resolves from this
# file's directory, so a run from a worktree would link into a directory that goes away.
[dotfiles]
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "symlink" }
"~/.config/mise/tasks" = { source = ".config/mise/tasks", mode = "symlink" }
"~/.claude/INSTRUCTIONS.md" = { source = ".claude/INSTRUCTIONS.md", mode = "symlink" }
"~/.claude/rules" = { source = ".claude/rules", mode = "symlink" }
"~/.claude/skills" = { source = ".claude/skills", mode = "symlink" }
# Lines rather than the whole file, which stays machine-local.
"~/.claude/CLAUDE.md/instructions" = { line = "@INSTRUCTIONS.md" }
"~/.claude/CLAUDE.md/rtk" = { line = "@RTK.md" }

[bootstrap.hooks]
pre-dotfiles = '''
test "$(git rev-parse --path-format=absolute --git-dir)" = "$(git rev-parse --path-format=absolute --git-common-dir)" || {
  echo "run mise bootstrap from the main checkout: from a worktree, [dotfiles] would link into it" >&2
  exit 1
}
'''

# CI runs each `qa:` task by name as a job of its own (.github/workflows/ci.yml), so a
# check that belongs in CI goes under `qa:`, and a new `qa:` task needs its own job
# there too: `qa:**` picks it up here and nothing picks it up in CI. `**`, not `*`, because mise's
# `*` matches a single task segment and would leave `qa:links:offline` out.
# The steps under `run` are the ones CI leaves out: `claude plugin validate` needs the
# Claude Code CLI, and `mix format` an Elixir toolchain, neither of which CI installs.
# `secrets:commit-scan` is a shared task, so it sits outside `qa:`; CI scans a pull
# request's commits with its own jobs instead of the staged diff this one reads.
# `link-check:staged` sits outside `qa:` for the same reason, and because a networked
# check would gate a pull request on third-party hosts.
[tasks.pre-commit]
description = "Run pre-commit checks"
depends = ["qa:**", "secrets:commit-scan", "link-check:staged"]
run = [
  "claude plugin validate .claude/skills",
  "mix format --check-formatted scripts/*.exs",
]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

[tasks."qa:sh"]
description = "Lint and check formatting of shell scripts"
# Every shell file here ends in .sh, so one expression feeds both tools. It is a `find`
# rather than a glob because mise loads a task under tasks/ at whatever depth it sits at,
# and `sh` — which is what runs this — has no recursive glob to match that.
run = [
  "find {{ vars.sh_paths }} -name '*.sh' -exec shellcheck {} +",
  "find {{ vars.sh_paths }} -name '*.sh' -exec shfmt -i 2 -d {} +",
]

# Offline, so a pull request never waits on a third-party host and a host being down
# never fails one; `link-check:staged` requests the links of the files a commit
# touches, and `link-check` below requests every link, which CI runs weekly without
# gating anything (.github/workflows/link-check-weekly.yml).
[tasks."qa:links:offline"]
description = "Check local links and anchors, and eval symlinks, without the network"
run = [
  "lychee --offline --no-progress .",
  # An eval suite reaches its skills through symlinks that a skill rename leaves dangling,
  # and `claude plugin validate` passes those; `find -L` lists only the dangling ones.
  "! find -L .claude/evals -type l | grep .",
]

[tasks."setup:dotfiles"]
description = "Run initial dotfiles setup (dircolors, gitignore, shell startup files, npm release window, pitchfork shell, rclone config encryption)"
run = "scripts/setup_dotfiles.sh"

# `mise bootstrap` runs this last, on every run, so each step must be safe to repeat.
[tasks.bootstrap]
description = "Finish machine setup after `mise bootstrap` links dotfiles and installs tools"
run = [
  { task = "setup:dotfiles" },
  "rtk init -g --auto-patch",
  "apm install",
  # Overwrites every gist skill, local edits not yet pushed included.
  { task = "skills:sync" },
  # Read from the file Claude Code keeps user-scoped servers in: `claude mcp get`
  # starts the server to check it, and `add-json` fails on one already there.
  "jq -e '.mcpServers[\"basic-memory\"]' ~/.claude.json >/dev/null 2>&1 || claude mcp add-json -s user basic-memory '{\"command\":\"uvx\",\"args\":[\"basic-memory\",\"mcp\"]}'",
]

[tasks.link-check]
description = "Check if links are valid, showing redirects"
run = "lychee -v ."

# A broken external link a commit adds is caught at the commit rather than by the next
# weekly run. Every link in a staged file is requested, old ones included, so a host
# failing on one of those blocks the commit too; one in an unstaged file blocks nothing.
# The failure names mise's own skip for this task alone, since the bypass at hand
# otherwise is `--no-verify`, which drops the secret scan with it.
# Markdown is the only file type here that `lychee .` reads. `--cache` skips links that
# passed within the last day; lychee never caches a failure.
[tasks."link-check:staged"]
description = "Check the links of staged Markdown files, over the network"
run = '''
git diff --cached --name-only --diff-filter=d -z -- '*.md' | xargs -0 -r lychee --cache --no-progress || {
  echo "If a failing link is not one this commit adds, skip only this check: MISE_TASK_SKIP=link-check:staged git commit ..." >&2
  exit 1
}
'''

[tasks.format-md]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks.format-sh]
description = "Format shell scripts"
# The same files pre-commit runs shfmt over, so this leaves that check nothing to reject.
run = "find {{ vars.sh_paths }} -name '*.sh' -exec shfmt -i 2 -w {} +"

[tasks."ccusage:daily"]
description = "Show Claude Code usage, cost by model and by repository (last 2 weeks) in a Quick Look popup"
run = 'scripts/ccusage_popup.exs daily'

[tasks."ccusage:weekly"]
description = "Show Claude Code usage, cost by model and by repository (last 9 weeks) in a Quick Look popup"
run = 'scripts/ccusage_popup.exs weekly'

[tasks."ccusage:monthly"]
description = "Show Claude Code usage, cost by model and by repository (last 12 months) in a Quick Look popup"
run = 'scripts/ccusage_popup.exs monthly'

[tasks."skills:list"]
description = "List gist-sourced skills declared in gistSkills.json"
run = "jq -r 'keys[]' gistSkills.json"

[tasks."skills:sync"]
description = "Vendor gist-sourced skills into .claude/skills/ (gitignored like APM deps; catalog is SoT)"
usage = 'arg "[name]" help="Skill from gistSkills.json to sync; omit to sync all"'
# ${usage_name:-} is intentionally unquoted: no arg must expand to zero args (sync all),
# not an empty-string arg, which the script would reject as an invalid name.
run = "scripts/sync_gist_skills.sh ${usage_name:-}"

[tasks."skills:push"]
description = "Push local edits to a gist-sourced SKILL.md back to its gist (external write; needs gh auth)"
usage = 'arg "<name>" help="Skill from gistSkills.json to push back to its gist"'
# $usage_name is a single required arg (usage errors if omitted); quote it since a skill
# name is one token, unlike the deliberately unquoted optional arg in skills:sync.
run = 'scripts/push_gist_skill.sh "$usage_name"'

[tasks."skills:remove"]
description = "Uninstall apm skill(s) from apm.yml, apm.lock.yaml, and .claude/skills/"
usage = 'arg "<pkg>" var=#true help="apm package path(s) to remove, e.g. blader/humanizer"'
# No cleanup step: the singular `target: claude` pin (not plural `targets:`) confines
# `apm uninstall` to .claude/skills/, so it never leaves a stray .agents/skills/ to prune.
# Keep the pin singular and don't re-add `rm -rf`.
# $usage_pkg is unquoted on purpose: a variadic arg arrives space-joined and must
# word-split into one positional per package (apm paths have no spaces).
run = "apm uninstall $usage_pkg"
