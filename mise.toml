[tools]
biome = "latest"
gitleaks = "latest"
jq = "latest"
lychee = "latest"
rumdl = "latest"
rust = { version = "latest", components = "clippy,rustfmt" }
shellcheck = "latest"
shfmt = "latest"
trufflehog = "latest"
yq = "latest"
"pipx:apm-cli" = "latest"

[env]
HOMEBREW_BUNDLE_DUMP_NO_CARGO = "1"
HOMEBREW_BUNDLE_DUMP_NO_NPM = "1"
HOMEBREW_BUNDLE_DUMP_NO_VSCODE = "1"

[vars]
# Where the shell files are, for the two tasks below that lint or format them. Named once
# because the lists had already drifted apart when each carried its own: format-sh was
# missing the .zshrc fragment, which pre-commit had always checked.
sh_paths = "scripts tasks zsh_fragments .claude/skills/find-kboat-repo/scripts"

# The pre-commit hook is regenerated on every install. It only runs the pre-commit
# task, so it goes stale only when mise's template or the task name changes, and a
# hook written once would then stay old with nothing saying so. `mise generate`
# moves the previous hook aside as `pre-commit.old`, replacing the one there, so a
# hook anything else put in its place is gone after the second install.
# The push scan is registered in git's config instead, which runs beside any
# pre-push hook file and is safe to set on every install (see tasks/README.md).
# Two more keep dotfiles-local current with main: `local:install` after a merge into
# main, such as sync-base's fast-forward, and after a switch to main. Set in the
# repository's config, they run in every worktree, whatever branch it is on, and
# `local:install` fails off main, so each tests the branch before running mise.
# post-checkout also runs on a checkout of files, whose third argument is 0
# where a switch's is 1. A failed hook would fail `git switch`, which stops sync-base
# before main moves, so a failed install only warns. git passes the hook's arguments
# after the command too, and the trailing `:` takes them.
# git before 2.54 ignores those keys, so the last line says so rather than
# leaving pushes unscanned and dotfiles-local stale in silence.
[hooks]
postinstall = '''
mise generate git-pre-commit --task pre-commit --write
git config hook.secrets-push-scan.event pre-push
git config hook.secrets-push-scan.command 'mise run secrets:push-scan'
git config hook.local-install-on-merge.event post-merge
git config hook.local-install-on-merge.command 'if test "$(git branch --show-current)" = main; then mise run local:install || echo "warning: dotfiles-local was not installed, so ~/.local/bin keeps its previous build" >&2; fi; :'
git config hook.local-install-on-switch.event post-checkout
git config hook.local-install-on-switch.command 'if test "$3" = 1 && test "$(git branch --show-current)" = main; then mise run local:install || echo "warning: dotfiles-local was not installed, so ~/.local/bin keeps its previous build" >&2; fi; :'
git hook list pre-push 2>/dev/null | grep -qx secrets-push-scan || echo "warning: this git ignores hook.* config, so pushes are not scanned and dotfiles-local is not installed when main moves; git 2.54 or later runs them" >&2
'''

# tasks/ holds the task definitions this repository shares with others (see README).
# Naming it here replaces the default file-task directories, which this repository
# does not use, and loads the shared tasks the way a consuming repository loads them.
[task_config]
includes = ["tasks"]

# `mise bootstrap` sets a machine up from this checkout: these dotfiles,
# then the tools, then the bootstrap task below. Each source resolves from this
# file's directory, so a run from a worktree would link into a directory that goes away.
[dotfiles]
"~/.config/mise/config.toml" = { source = ".config/mise/config.toml", mode = "symlink" }
"~/.config/uv/.python-version" = { content = "3.14\n" }
"~/.config/git/ignore" = { source = ".config/git/ignore", mode = "copy" }
# Its keys only: Claude Code writes the same file itself.
"~/.claude/settings.json/dotfiles" = { source = ".config/claude/settings.json", merge = true }
# cargo's release window (README.md, "Release window"). User config rather than
# CARGO_REGISTRY_GLOBAL_MIN_PUBLISH_AGE, which would outrank a project's own
# .cargo/config.toml. Its keys only: the file may hold others.
"~/.cargo/config.toml/dotfiles" = { source = ".config/cargo/config.toml", merge = true }
"~/.claude/CLAUDE.md" = { source = ".claude/CLAUDE.md", mode = "symlink" }
"~/.claude/rules" = { source = ".claude/rules", mode = "symlink" }
"~/.claude/skills" = { source = ".claude/skills", mode = "symlink" }
# Written out as content rather than linked, so it is no `.sh` file that `qa:sh`
# checks: after changing it, run
#   yq -r '.dotfiles."~/.local/bin/notify_desktop".content' mise.toml | shellcheck -
# An edit reaches ~/.local/bin only at the next `mise dot apply` or `mise bootstrap`.
"~/.local/bin/notify_desktop" = { permissions = "755", content = '''
#!/usr/bin/env bash
set -euo pipefail

# Usage: notify_desktop <title> <body>
# Posts a macOS notification, its title stamped with the time it is posted.

# The text reaches AppleScript as arguments, so none of it needs escaping.
osascript \
  -e 'on run argv' \
  -e 'display notification (item 2 of argv) with title (item 1 of argv) sound name "Glass"' \
  -e 'end run' \
  "$1 ($(date '+%m/%d %H:%M'))" "$2"
''' }

[bootstrap.hooks]
pre-dotfiles = '''
test "$(git rev-parse --path-format=absolute --git-dir)" = "$(git rev-parse --path-format=absolute --git-common-dir)" || {
  echo "run mise bootstrap from the main checkout: from a worktree, [dotfiles] would link into it" >&2
  exit 1
}
'''

# CI runs each `qa:` task by name in one of its jobs (.github/workflows/ci.yml), or
# through an aggregate one runs, as `qa:rust` gathers `qa:rust:*`, so a check that
# belongs in CI goes under `qa:`, and a new `qa:` task needs a job or such an aggregate
# too: `qa:**` picks it up here and nothing picks it up in CI. `**`, not `*`, because mise's
# `*` matches a single task segment and would leave `qa:links:offline` out.
# The steps under `run` are the ones CI leaves out: `claude plugin validate` needs the
# Claude Code CLI, which CI does not install.
# Validating `.claude/skills` reads it as a skills directory and does not reach the
# global-hooks plugin inside it, so that plugin is validated on its own. That run
# type-checks the function-hooks module, reporting each type error as a warning, so
# `--strict` is what makes one fail the commit.
# `secrets:commit-scan` is a shared task, so it sits outside `qa:`; CI scans a pull
# request's commits with its own jobs instead of the staged diff this one reads.
# `link-check:staged` sits outside `qa:` for the same reason, and because a networked
# check would gate a pull request on third-party hosts.
# `py:check-uv-pin` sits outside `qa:` because only a commit made here changes the two
# values it compares.
[tasks.pre-commit]
description = "Run pre-commit checks"
depends = ["qa:**", "secrets:commit-scan", "link-check:staged", "py:check-uv-pin"]
run = [
  "claude plugin validate .claude/skills",
  "claude plugin validate --strict .claude/skills/global-hooks",
  "claude plugin test .claude/skills/global-hooks",
]

[tasks."qa:md"]
description = "Lint markdown files"
run = "rumdl check"

# biome.json names the files: the function-hooks module under global-hooks.
[tasks."qa:ts"]
description = "Lint and check formatting of TypeScript"
run = "biome ci --error-on-warnings"

# Writes the installed CLI's type declarations, which global-hooks/tsconfig.json extends,
# for an editor to type-check the function-hooks module; pre-commit does not need them,
# since `claude plugin validate` type-checks the module itself. The engine writes them,
# git-ignored, beside a plugin in a `--plugin-dir` folder the session watches for saves,
# and not beside one it loads from the skills directory, so the task loads the module
# that way. A `-p` run watches the folder only under `CLAUDE_CODE_PLUGIN_DIR_WATCH`, and
# writes nothing without it. `/cost` is a command that runs without a model call, and
# the rest keeps the run from connecting MCP servers and making startup requests, which
# is most of its time, and from waiting on a stdin that is open and silent.
# The run exits 0 whether or not it wrote anything, so the old declarations go first and
# the last step fails on a run that wrote none instead of leaving stale ones in place.
[tasks."ts:types"]
description = "Write the installed Claude Code CLI's type declarations for editing the function-hooks module"
env = { CLAUDE_CODE_PLUGIN_DIR_WATCH = "1", CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC = "1" }
run = [
  "rm -rf .claude/skills/global-hooks/.claude-plugin/types",
  "claude -p --no-session-persistence --strict-mcp-config --plugin-dir .claude/skills/global-hooks /cost </dev/null >/dev/null",
  "test -f .claude/skills/global-hooks/.claude-plugin/types/tsconfig.json",
]

[tasks."qa:sh"]
description = "Lint and check formatting of shell scripts"
# Every shell file here ends in .sh, so one expression feeds both tools. It is a `find`
# rather than a glob because mise loads a task under tasks/ at whatever depth it sits at,
# and `sh` — which is what runs this — has no recursive glob to match that.
run = [
  "find {{ vars.sh_paths }} -name '*.sh' -exec shellcheck {} +",
  "find {{ vars.sh_paths }} -name '*.sh' -exec shfmt -i 2 -d {} +",
]

# One build, the test one, serves the warnings check, credo and the suite. The
# compiler's warnings include those of Elixir's type checker, which infers types
# without annotations, so a type check needs no tool of its own here.
# `--check-locked` fails where mix.exs changed a dependency and mix.lock did not
# follow. HEX_OFFLINE keeps the fetch, and so every commit, off the network: a new
# worktree gets the locked packages from Hex's cache in ~/.hex, and a package the
# cache lacks, as after a version bump, fails by name until `mix deps.get` in
# elixir/ fetches it. CI fetches before running this task.
# credo lists only five issues per category without `--all`, which a CI log would
# then hide; the exit status counts every issue either way.
[tasks."qa:ex"]
description = "Check formatting of, compile, lint and test the Elixir project"
dir = "{{config_root}}/elixir"
env = { MIX_ENV = "test", HEX_OFFLINE = "1" }
run = [
  "mix deps.get --check-locked",
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix credo --strict --all",
  "mix test --warnings-as-errors",
]

# The release pull request moves the version in rust/Cargo.toml and in each wrapper
# under tasks/ together; this fails where a wrapper was left behind. MIX_QUIET keeps
# out the compile progress Mix prints to stdout after an edit, ahead of the task's
# own output, where a pipe would read it as that output.
[tasks."qa:release-pins"]
description = "Check that each shared task pins the dotfiles-tasks release rust/Cargo.toml is at"
dir = "{{config_root}}/elixir"
env = { MIX_QUIET = "1" }
run = "mix dotfiles.release_pins"

# The checks written in Rust, and the checks of the Rust package itself, sit under
# `qa:rust:`, which `qa:rust` gathers for CI's rust-qa job to run.
[tasks."qa:rust"]
description = "Run every check under qa:rust:"
depends = ["qa:rust:*"]

# Each command names the whole workspace: run in rust/, cargo would otherwise take only
# the dotfiles-tasks package at its root.
[tasks."qa:rust:crate"]
description = "Check formatting of, lint and test every package of the Rust workspace"
dir = "{{config_root}}/rust"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
]

# The subcommand built from the working tree rather than the release the shared task
# pins: a release pull request, and main until that release is published, pin one that
# is not out yet, and this check gates both.
[tasks."qa:rust:skills"]
description = "Check that each tracked skill's body fits in what a compaction re-attaches"
run = "cargo run --manifest-path rust/Cargo.toml --locked --quiet -- skills-size-check"

# The shared task, run by the subcommand built from the working tree for the reason
# `qa:rust:skills` gives; a commit here, on a release pull request's branch included,
# waits on it. A `run` replaces the shared script, and the `.sh` keeps the name the
# subcommand's failure tells a commit to skip.
[tasks."link-check:staged.sh"]
description = "Check the links of staged files"
run = "cargo run --manifest-path rust/Cargo.toml --locked --quiet -- link-check-staged"

# The shared task, run by the subcommand built from the working tree for the reason
# `qa:rust:skills` gives; the pre-push hook runs it as `secrets:push-scan`, which
# resolves to this name, and the remote and the pushed refs reach the subcommand as the
# hook gives them.
[tasks."secrets:push-scan.sh"]
description = "Scan the commits a push is about to send for secrets"
run = "cargo run --manifest-path rust/Cargo.toml --locked --quiet -- secrets-push-scan"

# Offline, so a pull request never waits on a third-party host and a host being down
# never fails one; `link-check:staged` requests the links of the files a commit
# touches, and `link-check` below requests every link, which CI runs weekly without
# gating anything (.github/workflows/link-check-weekly.yml).
[tasks."qa:links:offline"]
description = "Check local links and anchors, and eval symlinks, without the network"
run = [
  "lychee --offline --no-progress .",
  # An eval suite reaches its skills through symlinks that a skill rename leaves dangling,
  # and `claude plugin validate` passes those; `find -L` lists only the dangling ones.
  "! find -L .claude/evals -type l | grep .",
]

[tasks."py:check-uv-pin"]
description = "Check that uv's global Python pin matches the python in the global mise config"
run = '''
mise_python="$(yq '.tools.python' .config/mise/config.toml)"
uv_pin="$(yq '.dotfiles["~/.config/uv/.python-version"].content' mise.toml)"
test "$mise_python" = "$uv_pin" || {
  echo "uv pins Python $uv_pin (mise.toml), but mise uses $mise_python (.config/mise/config.toml)" >&2
  exit 1
}
'''

[tasks."setup:dotfiles"]
description = "Run initial dotfiles setup (dircolors, shell startup files, npm and Hex release windows, rclone config encryption)"
run = "scripts/setup_dotfiles.sh"

# `mise bootstrap` runs this last, on every run, so each step must be safe to repeat.
[tasks.bootstrap]
description = "Finish machine setup after `mise bootstrap` links dotfiles and installs tools"
run = [
  { task = "setup:dotfiles" },
  # Restores every skill to its pinned copy, over a gist skill's edit not yet pushed too.
  "apm install",
  # Read from the file Claude Code keeps user-scoped servers in: `claude mcp get`
  # starts the server to check it, and `add-json` fails on one already there.
  "jq -e '.mcpServers[\"basic-memory\"]' ~/.claude.json >/dev/null 2>&1 || claude mcp add-json -s user basic-memory '{\"command\":\"uvx\",\"args\":[\"basic-memory\",\"mcp\"]}'",
  # Last, since off main it fails, and the steps above need no branch.
  { task = "local:install" },
]

# Installs dotfiles-local from this checkout, and only from main: every caller runs the
# installed copy, so a feature branch's build would stand in for main's everywhere; such
# a branch tries its change with `cargo run` in its worktree. Silence off main would let
# bootstrap pass with no binary in place, so this fails there instead. `cargo install`
# copies the binary, so a later `cargo clean` leaves it working, and rebuilds and copies
# again on every run, changed or not.
[tasks."local:install"]
description = "Install dotfiles-local into ~/.local/bin from this checkout, on main only"
run = '''
test "$(git branch --show-current)" = main || {
  echo "dotfiles-local installs from main only: run this in a checkout on main, or try a branch with cargo run" >&2
  exit 1
}
cargo install --locked --path rust/crates/local --profile local --root ~/.local
'''

[tasks.link-check]
description = "Check if links are valid, showing redirects"
run = "lychee -v ."

[tasks.format-md]
description = "Format markdown files"
run = "rumdl check --fix"

[tasks.format-ts]
description = "Format TypeScript and apply safe lint fixes"
run = "biome check --write"

[tasks.format-sh]
description = "Format shell scripts"
# The same files pre-commit runs shfmt over, so this leaves that check nothing to reject.
run = "find {{ vars.sh_paths }} -name '*.sh' -exec shfmt -i 2 -w {} +"

[tasks."ccusage:daily"]
description = "Show Claude Code usage, cost by model and by repository (last 2 weeks) in a Quick Look popup"
run = "~/.local/bin/dotfiles-local ccusage-popup daily"

[tasks."ccusage:weekly"]
description = "Show Claude Code usage, cost by model and by repository (last 9 weeks) in a Quick Look popup"
run = "~/.local/bin/dotfiles-local ccusage-popup weekly"

[tasks."ccusage:monthly"]
description = "Show Claude Code usage, cost by model and by repository (last 12 months) in a Quick Look popup"
run = "~/.local/bin/dotfiles-local ccusage-popup monthly"

[tasks."skills:push"]
description = "Push local edits to a gist-sourced SKILL.md back to its gist and pin it (external write; needs gh auth)"
usage = 'arg "<name>" help="Alias of a gist dependency in apm.yml to push back to its gist"'
# $usage_name is a single required arg (usage errors if omitted); quote it since a skill
# name is one token.
run = 'scripts/push_gist_skill.sh "$usage_name"'

[tasks."skills:unmanaged"]
description = "List entries under .claude/skills/ that neither git tracks nor apm.lock.yaml deploys"
run = "~/.local/bin/dotfiles-local skills-unmanaged"

[tasks."mise:multi-upgrade"]
description = "Upgrade mise tools directory by directory, asking for each first; `-- --help` lists its options"
run = "~/.local/bin/dotfiles-local mise-multi-upgrade"

# dotfiles-local updates the apm.yml and apm.lock.yaml of the directory it runs in, which
# a task with no `dir` leaves as this checkout's root, wherever `mise run` was called from.
[tasks."skills:update"]
description = "Update apm skill(s), holding back any whose upstream change merged under a day ago"
run = "~/.local/bin/dotfiles-local skills-update"

[tasks."skills:remove"]
description = "Uninstall apm skill(s) from apm.yml, apm.lock.yaml, and .claude/skills/"
# No cleanup step: the singular `target: claude` pin (not plural `targets:`) confines
# `apm uninstall` to .claude/skills/, so it never leaves a stray .agents/skills/ to prune.
# Keep the pin singular and don't re-add `rm -rf`.
run = "apm uninstall"
