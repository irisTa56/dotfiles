[tools]
elixir = "1.20"
erlang = "29"
node = "24"
python = "3.14"
awscli = { version = "latest", symlink_bins = "true" }
cargo-binstall = "latest"
claude-code = "latest"
cmake = "latest"
entire = "latest"
fnox = "latest"
gcloud = "latest"
git-lfs = "latest"
gping = "latest"
hwatch = "latest"
jq = "latest"
lychee = "latest"
mkcert = "latest"
ollama = "latest"
pandoc = "latest"
rclone = "latest"
rumdl = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
uv = "latest"
# Its release assets are bare binaries named `<os>-<arch>`, and mise strips the arch suffix
# from one to name the executable, which leaves `darwin`; `bin` names it instead of that.
"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
# The registry's `trunk` is trunk.io's launcher, and aqua has no package for this one.
"github:trunk-rs/trunk" = "latest"
"npm:ccusage" = "latest"
"npm:diff2html-cli" = "latest"
"pipx:basic-memory" = "latest"

[env]
ERL_AFLAGS = "-kernel shell_history enabled"

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python", "ruby"]
