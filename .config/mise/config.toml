[tools]
elixir = "1.20"
erlang = "29"
node = "24"
python = "3.14"
awscli = { version = "latest", symlink_bins = "true" }
cargo-binstall = "latest"
claude-code = "latest"
cmake = "latest"
entire = "latest"
fnox = "latest"
gcloud = "latest"
gh = "latest"
git-lfs = "latest"
gping = "latest"
jq = "latest"
lychee = "latest"
mkcert = "latest"
ollama = "latest"
pandoc = "latest"
pitchfork = "latest"
rclone = "latest"
rtk = "latest"
rumdl = "latest"
rust = "latest"
shellcheck = "latest"
shfmt = "latest"
trufflehog = "latest"
uv = "latest"
# Its release assets are bare binaries named `<os>-<arch>`, and mise strips the arch suffix
# from one to name the executable, which leaves `darwin`; `bin` names it instead of that.
"github:seachicken/gh-poi" = { version = "latest", bin = "gh-poi" }
"npm:ccusage" = "latest"
"npm:diff2html-cli" = "latest"
"pipx:basic-memory" = "latest"

[env]
ERL_AFLAGS = "-kernel shell_history enabled"

# The README's Secrets section is the convention this task carries out.
# It works in the main checkout, not a worktree: fnox.local.toml is git-ignored,
# so a worktree has none, and fnox finds the main checkout's from one under it.
# `fnox set` writes to fnox.toml when the directory has one, hence `-c`.
# raw keeps stdin on the terminal for fnox's prompt.
[tasks."secrets:add"]
description = "Store an API key in the keychain for this repository, through fnox"
usage = 'arg "<name>" help="Environment variable the key is passed as"'
dir = "{{cwd}}"
raw = true
shell = "bash -c"
run = '''
set -euo pipefail
# Appending to a file whose last line lacks a newline would glue the two.
end_line() { if [[ -s $1 && -n "$(tail -c1 "$1")" ]]; then echo >>"$1"; fi; }
root="$(git worktree list --porcelain | sed -n '1s/^worktree //p')"
cd "$root"
touch fnox.local.toml
# fnox parses the file, so a provider declared in any TOML form counts,
# and a file it cannot parse stops the task before anything is appended.
providers="$(fnox provider list -c fnox.local.toml)"
if ! grep -qx keychain <<<"$providers"; then
  end_line fnox.local.toml
  printf '[providers.keychain]\ntype = "keychain"\nservice = "%s"\n\n' "$(basename "$root")" >>fnox.local.toml
fi
fnox set -c fnox.local.toml "$usage_name" --provider keychain
if ! grep -qsF 'fnox exec' CLAUDE.local.md; then
  end_line CLAUDE.local.md
  echo '- Secrets here come from the macOS keychain through fnox (`fnox.local.toml`), not `.env`: run a command that needs one as `fnox exec -- <command>`.' >>CLAUDE.local.md
fi
'''

[settings]
experimental = true
idiomatic_version_file_enable_tools = ["python", "ruby"]

[settings.github]
credential_command = "gh auth token"
