[package]
name = "dotfiles-local"
version = "0.7.0"
description = "The commands for this machine alone, installed from the main checkout"
edition = "2024"
repository = "https://github.com/irisTa56/dotfiles"
publish = false

[dependencies]
jiff = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-transcode = "1"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"

[lints]
workspace = true
