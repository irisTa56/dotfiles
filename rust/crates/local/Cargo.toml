[package]
name = "dotfiles-local"
version = "0.11.0"
description = "The commands for this machine alone, installed from the main checkout"
edition = "2024"
repository = "https://github.com/irisTa56/dotfiles"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dotfiles-shared = { path = "../shared" }
jiff = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde-transcode = "1"
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"

[lints]
workspace = true
