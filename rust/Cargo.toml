[package]
name = "dotfiles-tasks"
version = "0.11.0"
description = "The shared tasks that other repositories run through mise"
edition = "2024"
repository = "https://github.com/irisTa56/dotfiles"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
dotfiles-shared = { path = "crates/shared" }
regex = "1"
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

# dotfiles-local, the commands for this machine alone, built from the main checkout and
# never released, and dotfiles-shared, code meant for both it and this package.
[workspace]
members = ["crates/local", "crates/shared"]

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# A print macro panics on a pipe whose reader has gone; src/stream.rs writes instead.
print_stdout = "warn"
print_stderr = "warn"

# A release binary is what consumers download, so it is built small.
[profile.release]
strip = true
lto = true
codegen-units = 1

# What `mise run local:install` builds dotfiles-local with. The release profile's LTO
# only makes a download smaller, and this binary is built where it runs.
[profile.local]
inherits = "release"
lto = false
