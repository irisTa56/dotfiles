# Repository checks shared with other repositories through `task_config.includes`.
# This file uses the included-task format: each top-level table is a task name, with
# no `[tasks.…]` prefix. Schema: https://mise.jdx.dev/schema/mise-task.json
#
# A task that needs a tool mise can install declares it, so a consuming repository needs
# no `[tools]` entry of its own. Beyond that the library assumes only git and a POSIX
# shell, which is what shared-tasks.toml's task runs on.
#
# Paths in `run`, and a relative `file = "…"`, resolve against the CONSUMING repository's
# root, so they cannot reach a file of this repository's. A helper script belongs in the
# top-level scripts/ directory rather than in here, because mise loads every executable
# under an included task directory as a task of its own, named after its path, and that
# task would appear in every consuming repository. Reach it as "$MISE_TASK_DIR"/../scripts/…,
# which resolves because a `git::` include clones the whole repository, not this directory
# alone.

["secrets:scan"]
description = "Scan staged changes for secrets"
tools = { gitleaks = "latest" }
run = "gitleaks protect -v --staged"

["md:check"]
description = "Check markdown files"
tools = { rumdl = "latest" }
run = "rumdl check"

["md:format"]
description = "Format markdown files"
tools = { rumdl = "latest" }
run = "rumdl check --fix"

["links:check"]
description = "Check that links resolve, listing each one and its redirects"
tools = { lychee = "latest" }
# `lychee --cache` skips links that passed within the last day, so a commit waits
# on a third-party host only for links it has not seen pass lately. lychee never
# caches a failure. The cached run drops `-v` as well, since a per-link listing is
# for reading and a commit hook's is not read.
usage = 'flag "--cache" help="Skip links that passed within the last day, and print only the summary"'
run = '''
if [ "${usage_cache:-}" = "true" ]; then
  lychee --cache .
else
  lychee -v .
fi
'''
